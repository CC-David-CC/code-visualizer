<line x1="1341.44" y1="2340" x2="1658.56" y2="2340" class="divider"/>
<line x1="1341.44" y1="2376" x2="1658.56" y2="2376" class="divider"/>
<text x="1357.44" y="2362.4" class="code">parallel process boundary</text>
</g>
