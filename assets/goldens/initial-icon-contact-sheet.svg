<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1800 2520" width="1800" height="2520">
<title>DRAKON algorithm</title>
<style>.field{fill:#dff4f8}.route,.divider{fill:none;stroke:#111827;stroke-width:2}.icon{fill:#fff;stroke:#111827;stroke-width:2;stroke-linejoin:round}.code,.route-label{fill:#111827;font-family:'DejaVu Sans Mono',monospace;font-size:13px}</style>
<rect x="0" y="0" width="1800" height="2520" class="field"/>
<g id="contact_function_header" aria-label="Function Header: shortest_path(graph, start, goal)">
<rect x="141.44" y="92" width="317.12" height="48" rx="16" class="icon"/>
<text x="157.44" y="123.04" class="code">shortest_path(graph, start, goal)</text>
</g>
<g id="contact_end" aria-label="End: End">
<rect x="741.44" y="92" width="317.12" height="48" rx="24" class="icon"/>
<text x="757.44" y="123.04" class="code">End</text>
</g>
<g id="contact_action" aria-label="Action: distance = current_cost + weight">
<polygon points="1341.44,92 1658.56,92 1658.56,140 1341.44,140" class="icon"/>
<text x="1357.44" y="123.04" class="code">distance = current_cost + weight</text>
</g>
<g id="contact_if_question" aria-label="If Question: distance &lt; best[neighbor]">
<polygon points="141.44,372 458.56,372 498.56,396 458.56,420 141.44,420" class="icon"/>
<line x1="458.56" y1="372" x2="458.56" y2="420" class="divider"/>
<text x="157.44" y="403.04" class="code">distance &lt; best[neighbor]</text>
</g>
<g id="contact_select" aria-label="Select: match command">
<polygon points="741.44,372 1058.56,372 1098.56,396 1058.56,420 741.44,420" class="icon"/>
<line x1="1058.56" y1="372" x2="1058.56" y2="420" class="divider"/>
<text x="757.44" y="403.04" class="code">match command</text>
</g>
<g id="contact_case" aria-label="Case: case &#x27;open&#x27; if permitted">
<polygon points="1341.44,372 1658.56,372 1658.56,420 1341.44,420" class="icon"/>
<text x="1357.44" y="403.04" class="code">case &#x27;open&#x27; if permitted</text>
</g>
<g id="contact_branch_header" aria-label="Branch Header: Explore frontier">
<rect x="141.44" y="652" width="317.12" height="48" rx="16" class="icon"/>
<text x="157.44" y="683.04" class="code">Explore frontier</text>
</g>
<g id="contact_address" aria-label="Address: relax neighbors">
<rect x="741.44" y="652" width="317.12" height="48" rx="16" class="icon"/>
<text x="757.44" y="683.04" class="code">relax neighbors</text>
</g>
<g id="contact_call" aria-label="Call: result = solve(graph)">
<polygon points="1341.44,652 1658.56,652 1658.56,700 1341.44,700" class="icon"/>
<line x1="1357.44" y1="652" x2="1357.44" y2="700" class="divider"/>
<line x1="1642.56" y1="652" x2="1642.56" y2="700" class="divider"/>
<text x="1373.44" y="683.04" class="code">result = solve(graph)</text>
</g>
<g id="contact_assignment_shelf" aria-label="Assignment Shelf: best: dict[str, float]">
<polygon points="141.44,932 458.56,932 458.56,1004 141.44,1004" class="icon"/>
<line x1="141.44" y1="968" x2="458.56" y2="968" class="divider"/>
<text x="157.44" y="954.4" class="code">best: dict[str, float]</text>
<text x="157.44" y="990.4" class="code">initialize_distances(vertices)</text>
</g>
<g id="contact_signature_panel" aria-label="Signature Panel: parameters">
<polygon points="741.44,932 1058.56,932 1058.56,1004 741.44,1004" class="icon"/>
<line x1="741.44" y1="968" x2="1058.56" y2="968" class="divider"/>
<text x="757.44" y="954.4" class="code">parameters</text>
<text x="757.44" y="990.4" class="code">graph, start, goal</text>
</g>
<g id="contact_for_start" aria-label="For Start: for neighbor, weight in graph[node]">
<polygon points="1365.44,932 1634.56,932 1658.56,980 1341.44,980" class="icon"/>
<text x="1373.44" y="951.52" class="code">for neighbor, weight in</text>
<text x="1373.44" y="967.52" class="code">graph[node]</text>
</g>
<g id="contact_for_end" aria-label="For End: next neighbor">
