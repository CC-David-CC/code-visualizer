<line x1="1058.56" y1="1212" x2="1058.56" y2="1260" class="divider"/>
<text x="757.44" y="1243.04" class="code">f&quot;path={path}, cost={cost}&quot;</text>
</g>
<g id="contact_input" aria-label="Input: start = input(&#x27;Start: &#x27;)">
<polygon points="1381.44,1212 1698.56,1212 1698.56,1260 1381.44,1260 1341.44,1236" class="icon"/>
<line x1="1381.44" y1="1212" x2="1381.44" y2="1260" class="divider"/>
<text x="1397.44" y="1243.04" class="code">start = input(&#x27;Start: &#x27;)</text>
</g>
<g id="contact_delay" aria-label="Delay: delay 0.25 s">
<polygon points="157.44,1492 442.56,1492 458.56,1516 442.56,1540 157.44,1540 141.44,1516" class="icon"/>
<text x="173.44" y="1523.04" class="code">delay 0.25 s</text>
</g>
<g id="contact_period" aria-label="Period: render_cycle">
<polygon points="757.44,1492 1042.56,1492 1058.56,1516 1042.56,1540 757.44,1540 741.44,1516" class="icon"/>
<line x1="900" y1="1492" x2="900" y2="1540" class="divider"/>
<text x="773.44" y="1523.04" class="code">render_cycle</text>
<text x="916" y="1523.04" class="code">1/60 s</text>
</g>
<g id="contact_start_timer" aria-label="Start Timer: start timer · render_cycle">
<polygon points="1353.44,1492 1646.56,1492 1658.56,1504 1658.56,1528 1646.56,1540 1353.44,1540 1341.44,1528 1341.44,1504" class="icon"/>
<text x="1357.44" y="1523.04" class="code">start timer · render_cycle</text>
</g>
<g id="contact_synchronizer" aria-label="Synchronizer: render_cycle ≤ 1/60 s">
<polygon points="141.44,1772 458.56,1772 498.56,1796 458.56,1820 141.44,1820" class="icon"/>
<line x1="458.56" y1="1772" x2="458.56" y2="1820" class="divider"/>
<text x="157.44" y="1803.04" class="code">render_cycle ≤ 1/60 s</text>
</g>
<g id="contact_realtime_process" aria-label="Realtime Parallel Process: await refresh_view()">
<polygon points="741.44,1772 1058.56,1772 1058.56,1820 741.44,1820" class="icon"/>
<line x1="749.44" y1="1772" x2="749.44" y2="1820" class="divider"/>
<line x1="1050.56" y1="1772" x2="1050.56" y2="1820" class="divider"/>
<text x="765.44" y="1803.04" class="code">await refresh_view()</text>
</g>
<g id="contact_note_rich" aria-label="Rich Note: Why this route is preferred">
<polygon points="1341.44,1772 1634.56,1772 1658.56,1796 1658.56,1820 1341.44,1820" class="icon"/>
<line x1="1634.56" y1="1772" x2="1634.56" y2="1796" class="divider"/>
<line x1="1341.44" y1="1812" x2="1658.56" y2="1812" class="divider"/>
<text x="1357.44" y="1803.04" class="code">Why this route is preferred</text>
</g>
<g id="contact_note_right" aria-label="Right Note: Alternate route detail">
<polygon points="141.44,2052 434.56,2052 458.56,2076 458.56,2100 141.44,2100" class="icon"/>
<line x1="434.56" y1="2052" x2="434.56" y2="2076" class="divider"/>
<text x="157.44" y="2083.04" class="code">Alternate route detail</text>
</g>
<g id="contact_note_left" aria-label="Left Note: Precondition and invariant">
<polygon points="765.44,2052 1058.56,2052 1058.56,2100 741.44,2100 741.44,2076" class="icon"/>
<line x1="741.44" y1="2076" x2="765.44" y2="2076" class="divider"/>
<line x1="765.44" y1="2052" x2="765.44" y2="2076" class="divider"/>
<text x="781.44" y="2083.04" class="code">Precondition and invariant</text>
</g>
<g id="contact_loop_return" aria-label="Loop Return Arrow: continue iteration">
<polygon points="1365.44,2052 1658.56,2052 1658.56,2100 1365.44,2100 1341.44,2076" class="icon"/>
<text x="1373.44" y="2083.04" class="code">continue iteration</text>
</g>
<g id="contact_silhouette_transition" aria-label="Silhouette Transition: transition to Finish">
<polygon points="141.44,2332 458.56,2332 498.56,2356 458.56,2380 141.44,2380" class="icon"/>
<line x1="458.56" y1="2332" x2="458.56" y2="2380" class="divider"/>
<text x="157.44" y="2363.04" class="code">transition to Finish</text>
</g>
<g id="contact_connector_marker" aria-label="Connector Marker: A">
<polygon points="900,2332 948,2356 900,2380 852,2356" class="icon"/>
<text x="868" y="2363.04" class="code">A</text>
</g>
<g id="contact_concurrent_process_boundary" aria-label="Concurrent Process Boundary: parallel process boundary">
